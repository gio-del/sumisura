name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint, vet, test)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Runs `golangci-lint run ./...` against the repo-root .golangci.yml —
      # the same command and the same config a developer runs locally (see
      # README.md), so a failure here is reproducible without pushing. Placed
      # before the typst/poppler install and the test step: it needs neither
      # binary, so a formatting or dropped-error failure surfaces fast. The
      # linter version is pinned for the same reason ADR-0012/ADR-0016 pin
      # typst — a tool that gates the build doesn't float on latest.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: backend
          args: ./...

      # Render (backend/internal/generation/render.go) shells out to the
      # typst CLI, and generations_render_test.go exercises that real
      # binary — no skip guard. Install the exact version + font pinned in
      # typst-version.txt (ADR-0012, ADR-0016), the same file the backend
      # container and the tailor-cv skill's preflight check read, so the
      # skill's Render path, the container's Render path and CI can't drift
      # apart and these tests behave the same in CI as they do locally.
      # The ATS-parsability
      # check (backend/internal/generation/parsability.go) shells out to
      # pdftotext the same way, so poppler-utils is installed here too —
      # see backend/Dockerfile for why it's pinned there.
      - name: Install typst + Liberation Sans (pinned per ADR-0012)
        run: |
          # The pinned version and font family come from typst-version.txt
          # (repo root) — the same single source of truth backend/Dockerfile
          # sources at build time and the tailor-cv skill's preflight check
          # reads (ADR-0016). Don't hardcode the version here: bumping the
          # pin has to stay a single edit in that file.
          . ./typst-version.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-liberation fontconfig poppler-utils
          curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            -o /tmp/typst.tar.xz
          tar -xf /tmp/typst.tar.xz -C /tmp
          sudo mv /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          rm -rf /tmp/typst*
          # Fail loudly if what landed isn't what the pin file names.
          typst --version | grep -F "$TYPST_VERSION"
          fc-list | grep -qF "$TYPST_FONT_FAMILY"
          pdftotext -v

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: go test
        working-directory: backend
        run: go test ./...

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # Vitest + Testing Library + MSW (ADR-0019): jsdom and a faked network,
      # so no backend, ANTHROPIC_API_KEY or typst is needed here.
      - name: Test
        working-directory: frontend
        run: npm test

      # tsc -b also type-asserts the backend's golden API response fixtures
      # against src/api/types.ts (ADR-0035); the backend job's go test
      # fails when those fixtures are stale.
      - name: Build
        working-directory: frontend
        run: npm run build

  # A peer of backend/frontend rather than a step inside the frontend job:
  # capture regressions should read as capture regressions in the checks
  # list, and the extension's dependency tree (one devDependency, jsdom) is
  # independent of the frontend's — separate lockfile, separate cache key.
  extension:
    name: Extension (capture tests)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json

      # npm ci (not npm install): fixture parsing is jsdom-version-sensitive,
      # and the point of the suite is that a static document parses into the
      # same payload every time.
      - name: Install dependencies
        working-directory: extension
        run: npm ci

      - name: Test
        working-directory: extension
        run: npm test

  # The release image is what a self-hoster actually runs, so it is built
  # and exercised on every change rather than first at release time
  # (ADR-0039). amd64 only here: the multi-arch build belongs to the release
  # workflow, and emulating arm64 on every PR would cost minutes for a
  # signal this job already gives.
  image:
    name: Release image (build, smoke test)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sumisura:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Stub Master Data, the same copy a self-hoster makes on first run.
      - name: Seed a data directory
        run: |
          set -euo pipefail
          mkdir -p smoke/data smoke/output
          cp -r data/examples/. smoke/data/

      - name: Start the container
        run: |
          set -euo pipefail
          docker run -d --name sumisura-smoke -p 8080:8080 \
            -v "$PWD/smoke/data:/workspace/data" \
            -v "$PWD/smoke/output:/workspace/output" \
            sumisura:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/healthz >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "the container never became healthy" >&2
          docker logs sumisura-smoke >&2
          exit 1

      # One image, one port: the app shell, its API and a client-side route
      # all answer on 8080, with no CORS and no second service.
      - name: The app and the API answer on one port
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8080/ | grep -qi '<title>' \
            || { echo "GET / did not return the app shell" >&2; exit 1; }
          curl -fsS http://127.0.0.1:8080/api/master-data/entries | grep -q '\[' \
            || { echo "the API did not answer" >&2; exit 1; }
          curl -fsS http://127.0.0.1:8080/generations | grep -qi '<title>' \
            || { echo "a client-side route did not fall back to the app shell" >&2; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/nope)" = 404 \
            || { echo "an unrouted API path did not answer 404" >&2; exit 1; }

      # Render fidelity is the thing an image change could silently break:
      # typst and its fonts have to be present and produce a one-page PDF
      # from the stub data (ADR-0012, ADR-0016).
      - name: Rendering works inside the image
        run: |
          set -euo pipefail
          python3 - <<'PY' > payload.json
          import json, urllib.request
          entries = json.load(urllib.request.urlopen("http://127.0.0.1:8080/api/master-data/entries"))
          selected = [
              {
                  "entryId": e["id"],
                  "reason": "smoke test",
                  "bullets": [
                      {"sourceIndex": i, "source": b, "rewritten": b}
                      for i, b in enumerate(e.get("bullets") or [])
                  ],
              }
              for e in entries
          ]
          print(json.dumps({"slug": "smoke", "language": "en",
                            "selection": {"language": "en", "entries": selected}}))
          PY
          code=$(curl -s -o render.json -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' --data @payload.json \
            http://127.0.0.1:8080/api/generations/render)
          if [ "$code" != 200 ]; then
            echo "render returned $code:" >&2; cat render.json >&2
            docker logs sumisura-smoke >&2
            exit 1
          fi
          python3 -c "import json; d=json.load(open('render.json')); assert d['cvPageCount'] == 1, d; assert d['atsReports']['cv']['status'] == 'ok', d; print('rendered', d['cvPath'])"

      - name: Container logs on failure
        if: failure()
        run: docker logs sumisura-smoke
