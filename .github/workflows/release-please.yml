# Releases are automatic but gated: this workflow keeps a Release PR open with
# the accumulated changelog and version bump. A scheduled job on the maintainer's
# server merges it when the changelog has a feat/fix/perf entry, the bump is not
# major/1.0/breaking, CI is green, 7 days passed since the last release (unless
# fix-only) and the code ran 3 days on the server with no new bug issue. The
# merge is announced 24h ahead and can be postponed; the maintainer can still
# merge or close it by hand. Merging tags vX.Y.Z, publishes the GitHub Release,
# and triggers release-assets.yml. See ADR-0048.
name: Release

on:
  push:
    branches: [main]
  # Lets a failed or skipped run be retried without an empty commit — the
  # GitHub API occasionally fails a release-please run transiently.
  workflow_dispatch:

# Used only by the fallback path below; with the App token these come from the
# App's own installation permissions.
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    env:
      # secrets can't be read in a step `if:`, so surface it as env first.
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
    steps:
      # A PR opened with the default GITHUB_TOKEN does not trigger CI, which
      # leaves the Release PR unchecked. A GitHub App token does. Until the
      # app exists, fall back to GITHUB_TOKEN so releases still work — the only
      # cost is having to push an empty commit (or re-run CI) on the Release PR
      # before merging it.
      - name: Mint a GitHub App token
        id: app-token
        if: env.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
