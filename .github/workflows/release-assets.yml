# Runs when a release is published (i.e. when the Release PR is merged and
# release-please creates the release). Ships what a user would otherwise have
# to clone the repo to get: the browser extension zip, and the prebuilt
# multi-arch container image the release compose file runs (ADR-0039).
name: Release assets

on:
  release:
    types: [published]
  # A release created with GITHUB_TOKEN does not trigger other workflows, so
  # until the release App exists the `release: published` event never fires and
  # the assets have to be attached by hand: run this with the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to attach assets to (e.g. v0.1.0)
        required: true
        type: string

permissions:
  contents: write
  # Pushing the image to this repository's GHCR namespace.
  packages: write

jobs:
  extension-zip:
    name: Attach the browser extension zip
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the tag
        id: tag
        run: echo "name=${{ inputs.tag || github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.name }}

      # Ship what the browser loads and nothing else: no node_modules, no test
      # tooling, no fixtures. The version inside manifest.json was stamped by
      # release-please in the Release PR, so the zip and the tag agree.
      - name: Build the zip
        run: |
          set -euo pipefail
          version="${{ steps.tag.outputs.name }}"
          staging="$(mktemp -d)/sumisura-extension"
          mkdir -p "$staging"
          rsync -a --exclude node_modules \
                   --exclude 'fixtures' \
                   --exclude '*.test.js' \
                   --exclude 'package.json' \
                   --exclude 'package-lock.json' \
                   extension/ "$staging/"
          manifest_version="$(node -p "require('$staging/manifest.json').version")"
          if [ "$manifest_version" != "${version#v}" ]; then
            echo "manifest.json says $manifest_version but the tag is $version" >&2
            exit 1
          fi
          (cd "$(dirname "$staging")" && zip -qr "$GITHUB_WORKSPACE/sumisura-extension-${version}.zip" sumisura-extension)

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.tag.outputs.name }}" "sumisura-extension-${{ steps.tag.outputs.name }}.zip" --clobber

  image:
    name: Publish the container image
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the tag
        id: tag
        run: echo "name=${{ inputs.tag || github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.name }}

      # arm64 is emulated here rather than cross-built: the image installs a
      # per-architecture typst release and Debian packages, so it has to run
      # as the target architecture to assemble itself.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both the exact version and :latest. A self-hoster who wants
      # deliberate upgrades pins the version in .env; :latest is the
      # convenience tag the release compose file falls back to.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.tag.outputs.name }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
