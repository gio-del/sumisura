# Builds and publishes the landing page + docs (site/) to GitHub Pages.
#
# Path-filtered on purpose: a release or a backend change should not redeploy
# the site, and a typo fix in the docs should not wait on anything else. Pull
# requests build without deploying, so a broken site fails review rather than
# production.
name: Site

on:
  push:
    branches: [main]
    paths: ['site/**', 'brand/**', 'docs/screenshots/**', '.github/workflows/site.yml']
  pull_request:
    branches: [main]
    paths: ['site/**', 'brand/**', 'docs/screenshots/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
