# Running the app you are about to release, from your checkout, next to the
# one you rely on.
#
#   docker compose -f docker-compose.preview.yml up -d --build
#
# It builds the same Dockerfile the published image is built from, so what
# you see is the shape a self-hoster gets — one container, the backend
# serving the built frontend on one port — not the dev pair's Vite server
# (docker-compose.yml), which is for hot reload while writing code.
#
# It listens on 8081, so docker-compose.release.yml keeps 8080 and the app
# you use every day stays up while you review. To reach the preview from a
# phone over Tailscale, serve it on a second port:
#
#   tailscale serve --bg --https=8443 http://127.0.0.1:8081
#   tailscale serve --https=8443 off          # when you are done
#
# It reads and writes the same data/ and output/ as the release container.
# That is the point — you are reviewing against your real records — but it
# also means both are writing to them, so don't run a Generation in both at
# once. Stop it with:
#
#   docker compose -f docker-compose.preview.yml down
services:
  preview:
    build:
      # Repo root: the Dockerfile builds the frontend and the backend, and
      # COPYs the root-level typst-version.txt (ADR-0012, issue #55).
      context: .
    # A local tag, deliberately not ghcr.io/gio-del/sumisura:<version>:
    # building over a released tag would leave you unable to tell the
    # published image from your working tree.
    image: sumisura:preview
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SUMISURA_MODEL_DEFAULT: ${SUMISURA_MODEL_DEFAULT:-}
      SUMISURA_MODEL_SELECTION_REWRITE: ${SUMISURA_MODEL_SELECTION_REWRITE:-}
      SUMISURA_MODEL_SELECTION_PREVIEW: ${SUMISURA_MODEL_SELECTION_PREVIEW:-}
      SUMISURA_MODEL_COVER_LETTER: ${SUMISURA_MODEL_COVER_LETTER:-}
      SUMISURA_MODEL_RAL_RESEARCH: ${SUMISURA_MODEL_RAL_RESEARCH:-}
      SUMISURA_MODEL_RAL_EXTRACTION: ${SUMISURA_MODEL_RAL_EXTRACTION:-}
      SUMISURA_MODEL_APPLICATION_METHOD_INFERENCE: ${SUMISURA_MODEL_APPLICATION_METHOD_INFERENCE:-}
      SUMISURA_MODEL_CONTACT_RESEARCH: ${SUMISURA_MODEL_CONTACT_RESEARCH:-}
      SUMISURA_MODEL_CONTACT_EXTRACTION: ${SUMISURA_MODEL_CONTACT_EXTRACTION:-}
      SUMISURA_MODEL_CAPTURE_HINTS: ${SUMISURA_MODEL_CAPTURE_HINTS:-}
      # Same token as the release container, so a device that already has
      # access keeps it: the access cookie is an HMAC keyed by this value
      # (issue #181).
      LAN_AUTH_TOKEN: ${LAN_AUTH_TOKEN:-}
    volumes:
      - ./data:/workspace/data
      - ./output:/workspace/output
    ports:
      # 127.0.0.1 by default, like both other compose files (ADR-0004).
      # PREVIEW_PORT moves it if 8081 is taken.
      - "${BIND_ADDR:-127.0.0.1}:${PREVIEW_PORT:-8081}:8080"
    # The backend drains in-flight requests for up to 15s on SIGTERM
    # (ADR-0021); Docker's default 10s would kill it mid-drain.
    stop_grace_period: 30s
