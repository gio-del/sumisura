services:
  backend:
    # No `profiles:` key here on purpose: Compose only starts a service
    # under a profile it declares, and there's no implicit "default" name
    # that auto-activates — declaring one would make plain `docker compose
    # up` start nothing. Both services stay profile-less so `docker compose
    # up` is unchanged; `docker compose --profile lan up` still starts them
    # (profile-less services always run) while the `lan` label documents
    # the intent. The actual LAN-reachable opt-in is BIND_ADDR/LAN_AUTH_TOKEN
    # below (issue #57, ADR-0004).
    build:
      # Repo root, not ./backend — the Dockerfile also COPYs the
      # root-level typst-version.txt (single source of truth for the
      # pinned typst version, see ADR-0012 and issue #55).
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATA_DIR: /workspace/data
      PROJECT_ROOT: /workspace
      PORT: "8080"
      # Generation calls the Claude API directly (ADR-0005). Set this in a
      # root .env file (see .env.example) or export it before `docker
      # compose up` — compose does not forward host env vars into
      # containers unless referenced here. Left unset, the app still runs
      # (Master Data browsing works); only Generation requests fail, with
      # a clear "no Anthropic credentials found" error.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Optional per-call-site Claude model overrides (ADR-0025, see
      # .env.example). Empty means "use the built-in default".
      SUMISURA_MODEL_DEFAULT: ${SUMISURA_MODEL_DEFAULT:-}
      SUMISURA_MODEL_SELECTION_REWRITE: ${SUMISURA_MODEL_SELECTION_REWRITE:-}
      SUMISURA_MODEL_SELECTION_PREVIEW: ${SUMISURA_MODEL_SELECTION_PREVIEW:-}
      SUMISURA_MODEL_COVER_LETTER: ${SUMISURA_MODEL_COVER_LETTER:-}
      SUMISURA_MODEL_RAL_RESEARCH: ${SUMISURA_MODEL_RAL_RESEARCH:-}
      SUMISURA_MODEL_RAL_EXTRACTION: ${SUMISURA_MODEL_RAL_EXTRACTION:-}
      SUMISURA_MODEL_APPLICATION_METHOD_INFERENCE: ${SUMISURA_MODEL_APPLICATION_METHOD_INFERENCE:-}
      SUMISURA_MODEL_CONTACT_RESEARCH: ${SUMISURA_MODEL_CONTACT_RESEARCH:-}
      SUMISURA_MODEL_CONTACT_EXTRACTION: ${SUMISURA_MODEL_CONTACT_EXTRACTION:-}
      SUMISURA_MODEL_CAPTURE_HINTS: ${SUMISURA_MODEL_CAPTURE_HINTS:-}
      # LAN-reachable mode (opt-in, issue #57): leave unset for the default
      # localhost-only/no-auth behavior. Set alongside BIND_ADDR=0.0.0.0
      # (below) and run with `docker compose --profile lan up` to make the
      # app reachable from other devices on the LAN; every /api/* request
      # then requires this exact value in the X-Sumisura-Token header.
      # See README.md/CLAUDE.md for the tradeoffs this mode accepts.
      LAN_AUTH_TOKEN: ${LAN_AUTH_TOKEN:-}
    # The backend drains in-flight requests for 15s after SIGTERM (see
    # api.DefaultDrainTimeout) so `docker compose down` doesn't throw away
    # a Job Listing save that is one Claude call from finishing. Docker's
    # default grace period is 10s, which would SIGKILL the process in the
    # middle of that drain; 30s leaves the drain room to finish and still
    # bounds how long a stop can take.
    stop_grace_period: 30s
    volumes:
      # Render's typst invocation needs template/ and output/ alongside
      # data/, all under one --root (see ADR-0012), so the whole project
      # root is mounted rather than just data/ as before.
      - .:/workspace
    ports:
      # BIND_ADDR defaults to 127.0.0.1 (today's unchanged behavior). Set
      # BIND_ADDR=0.0.0.0 together with LAN_AUTH_TOKEN and invoke with
      # `docker compose --profile lan up` for LAN-reachable mode.
      - "${BIND_ADDR:-127.0.0.1}:8080:8080"

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${BIND_ADDR:-127.0.0.1}:5173:5173"
    depends_on:
      - backend
