# Static, always-included content: contact info, education, and the Static
# Sections (publications, certifications, awards, activities, languages). Never subject to
# Selection; only `summary` is adapted to the Job Description by Rewrite — see CONTEXT.md.
#
# NOTE: this is example/stub data. Replace with your own before using the
# tailoring pipeline — this file is committed to a public repo, so keep real
# personal details (name, contact info, education, publications) out of it.

name: Jane Doe
location: Example City, Country
email: jane.doe@example.com
phone: "+1 555 0100"
linkedin: janedoe
github: janedoe

# Optional (issue #232): a note printed next to the location, the headline
# under the name, and the About me. A Tailored Generation adapts the summary
# to the Job Description without adding facts; Default Mode prints it as is.
location_note: Open to relocate
headline: Data Engineer
# Optional (issue #238): other headlines Selection may print instead, chosen
# per Job Description, spelled exactly as written. Each must be a title you
# can defend. Without it the headline above always prints.
headline_options: [Data Engineer, AI Engineer]
summary: >
  Data engineer in consulting, building data platforms and LLM features for
  enterprise clients. One or two more sentences in your own words.

# Optional (issue #232): how the CV names an employer (keyed by the Entries'
# `employer` value) and the role it states for the whole employment. That
# employer's Client Engagements print as projects under this one heading.
employers:
  Example Consulting S.p.A.:
    display: Example Consulting, IT consulting
    role: Data Engineer
    # Optional (issue #238): other roles this employment may state, chosen
    # per Job Description (e.g. the contractual title).
    role_options: [Data Engineer, AI & Data Engineer]

education:
  - degree: MSc
    institution: Example University
    program: Computer Science and Engineering
    start: "2022"
    end: "2024-04"
    grade: "Example grade"
    thesis: "One line naming the thesis topic"
    courses:
      - Distributed Systems
      - Advanced Algorithms and Parallel Programming
      - Machine Learning
      - Computer Security
      - Software Engineering
      - Databases
  - degree: BSc
    institution: Example University
    program: Computer Science and Engineering
    start: "2019"
    end: "2022"
    grade: "Example grade"
    courses:
      - Computer Architectures
      - Operating Systems
      - Databases
      - Data Structures and Algorithms
      - Software Engineering

publications:
  - title: "Example Paper Title: A Study of Something Interesting"
    authors: "Jane Doe, Alex Example, Sam Sample"
    venue: "Example Conference/Journal 2025"
    link: "https://example.com/paper"
    degree: MSc # optional: prints under that degree instead of a Publications section
    note: >
      One or two sentences of context about the publication.

certifications:
  - title: "Example Certification (Associate level)"
    issuer: "Example Cloud Provider"
    date: "2025-03"
    link: "https://example.com/verify/123"

awards:
  - title: "Example Award (Example University, 2020)"
    description: "One line describing the award and why it was given."

activities:
  - title: "Example Activity (2019-2023)"
    description: "One line describing the activity."

languages:
  - name: English
    level: Native
  - name: Example Language
    level: "Professional working proficiency"
